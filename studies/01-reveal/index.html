<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Shift: Reveal</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e4e4e4; --ink:#1c1c1c; --muted:#6a6a6a;
  --btn-bg:#d2d2d2; --btn-ink:#1c1c1c; --btn-line:#8a8a8a;
  --btn-bg-h:#f2f2f2; --btn-line-h:#1c1c1c;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#141414; --ink:#e6e6e6; --muted:#8c8c8c;
  }
}
:root[data-theme="dark"]{ --page:#141414; --ink:#e6e6e6; --muted:#8c8c8c; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;gap:18px;
}
header{width:100%;max-width:880px}
h1{margin:0;font-size:1.25rem;font-weight:500;letter-spacing:.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.stage{
  position:relative;width:100%;max-width:880px;aspect-ratio:16/9;
  background:#1b1b1b;overflow:hidden;border-radius:2px;
  --t:1000ms;
}
.stage svg{display:block;width:100%;height:100%}
.on-only{opacity:0;transition:opacity var(--t) ease-in-out}
.stage.lit .on-only{opacity:1}
.off-only{opacity:1;transition:opacity var(--t) ease-in-out}
.stage.lit .off-only{opacity:0}
#shadow{
  opacity:0;transform:translateX(-22px) scaleX(.55);transform-box:fill-box;transform-origin:left center;
  transition:opacity 800ms ease-out 150ms,transform 1000ms cubic-bezier(.2,.7,.2,1)
}
.stage.lit #shadow{opacity:1;transform:none}
#lamp{cursor:pointer;outline:none}
#lamp .halo{opacity:0;transition:opacity 300ms ease}
#lamp:hover .halo,#lamp:focus-visible .halo{opacity:1}
.stage.lit #lamp{pointer-events:none;cursor:default}
.stage.lit #lamp .halo{opacity:0}

.btn{
  position:absolute;left:3%;top:46%;
  font:600 .72rem/1 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  letter-spacing:.12em;padding:12px 14px;
  background:var(--btn-bg);color:var(--btn-ink);
  border:1px solid var(--btn-line);border-radius:2px;cursor:pointer;
  transition:background-color 260ms ease,border-color 260ms ease,color 260ms ease,transform 260ms ease;
}
.btn:hover{background:var(--btn-bg-h);border-color:var(--btn-line-h);transform:translateX(3px)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn:active{transform:translateX(3px) scale(.98)}
.btn[disabled]{
  cursor:default;background:transparent;color:#9a9a9a;border-color:#4a4a4a;transform:none;
}
.status{width:100%;max-width:880px;min-height:1.2em;margin:0;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:reduce){
  .stage{--t:300ms}
  #shadow{transition-duration:300ms;transition-delay:0ms;transform:none}
  .btn{transition:none}
}
</style>
</head>
<body>
<header>
  <h1>Shadow Shift: Reveal</h1>
  <p>One action: turn on the light.</p>
</header>

<div class="stage" id="stage">
  <svg viewBox="0 0 800 450" role="img" aria-label="A sphere on a floor beside an unlit lamp. Turning on the lamp reveals a shadow to the right of the sphere.">
    <defs>
      <radialGradient id="glow" cx="330" cy="200" r="380" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#f4f4f4" stop-opacity=".55"/>
        <stop offset=".35" stop-color="#cfcfcf" stop-opacity=".22"/>
        <stop offset="1" stop-color="#9a9a9a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sphereOff" cx="42%" cy="38%" r="70%">
        <stop offset="0" stop-color="#4a4a4a"/>
        <stop offset="1" stop-color="#232323"/>
      </radialGradient>
      <radialGradient id="sphereOn" cx="32%" cy="32%" r="75%">
        <stop offset="0" stop-color="#f2f2f2"/>
        <stop offset=".55" stop-color="#a8a8a8"/>
        <stop offset="1" stop-color="#4a4a4a"/>
      </radialGradient>
      <linearGradient id="floorOff" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#1d1d1d"/>
      </linearGradient>
      <linearGradient id="floorOn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7a7a7a"/><stop offset="1" stop-color="#4a4a4a"/>
      </linearGradient>
      <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
      <filter id="soft" x="-30%" y="-100%" width="160%" height="300%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
    </defs>

    <!-- room -->
    <rect width="800" height="450" fill="#1b1b1b"/>
    <rect y="365" width="800" height="85" fill="url(#floorOff)"/>
    <g class="on-only">
      <rect width="800" height="365" fill="#353535"/>
      <rect y="365" width="800" height="85" fill="url(#floorOn)"/>
      <rect width="800" height="450" fill="url(#glow)"/>
    </g>

    <!-- shadow: one, on the side opposite the lamp -->
    <ellipse id="shadow" cx="700" cy="368" rx="88" ry="12" fill="#0e0e0e" opacity="0" filter="url(#soft)"/>

    <!-- sphere -->
    <circle cx="590" cy="295" r="70" fill="url(#sphereOff)"/>
    <circle class="on-only" cx="590" cy="295" r="70" fill="url(#sphereOn)"/>

    <!-- lamp (clickable) -->
    <g id="lamp" role="button" tabindex="0" aria-label="Turn on light">
    <rect x="276" y="135" width="108" height="236" fill="#000" fill-opacity="0"/>
    <g class="halo" fill="none" stroke="#f0f0f0">
      <g filter="url(#halo)" stroke-width="3" opacity=".8">
        <path d="M286 190 Q330 140 374 190 Z"/><rect x="328" y="196" width="4" height="162"/><rect x="296" y="356" width="68" height="10" rx="3"/>
      </g>
      <g stroke-width="1.2">
        <path d="M286 190 Q330 140 374 190 Z"/><rect x="328" y="196" width="4" height="162"/><rect x="296" y="356" width="68" height="10" rx="3"/>
      </g>
    </g>
    <ellipse cx="330" cy="366" rx="34" ry="6" fill="#0f0f0f" opacity=".6"/>
    <rect x="296" y="356" width="68" height="10" rx="3" fill="#3a3a3a"/>
    <rect x="328" y="196" width="4" height="162" fill="#3a3a3a"/>
    <circle cx="330" cy="203" r="11" fill="#2a2a2a"/>
    <circle class="on-only" cx="330" cy="203" r="11" fill="#fafafa"/>
    <circle class="on-only" cx="330" cy="203" r="20" fill="#ffffff" opacity=".25"/>
    <path d="M286 190 Q330 140 374 190 Z" fill="#454545"/>
    <path class="on-only" d="M286 190 Q330 140 374 190 Z" fill="#8e8e8e"/>
    </g>
  </svg>
  <button class="btn" id="btn" type="button">TURN ON LIGHT</button>
</div>

<p class="status" id="status" role="status" aria-live="polite"></p>

<script>
(function(){
  var stage=document.getElementById('stage');
  var btn=document.getElementById('btn');
  var status=document.getElementById('status');
  var lamp=document.getElementById('lamp');
  function turnOn(){
    if(stage.classList.contains('lit'))return;
    stage.classList.add('lit');
    lamp.removeAttribute('tabindex');
    lamp.setAttribute('aria-label','Light is on');
    btn.disabled=true;
    btn.textContent='LIGHT ON';
    status.textContent='The light is on. A shadow settles to the right of the sphere.';
  }
  btn.addEventListener('click',turnOn);
  lamp.addEventListener('click',turnOn);
  lamp.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();turnOn();}
  });
})();
</script>
</body>
</html>
